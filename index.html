<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浮世空戦 · Ukiyo-e Sky War</title>
<meta name="description" content="A ukiyo-e styled 3D aerial shooter delivered as a single interactive SVG file.">
<meta property="og:title" content="浮世空戦 · Ukiyo-e Sky War">
<meta property="og:description" content="浮世绘风格 3D 即时空战——整个游戏只是一个 SVG 文件。">
<meta property="og:image" content="docs/screenshot.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23b8331f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23efe3c8'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #15120f; overflow: hidden; }
  iframe { display: block; width: 100vw; height: 100vh; height: 100dvh; border: 0; }
</style>
</head>
<body>
<iframe id="game" src="ukiyo-sky-war.svg" title="浮世空戦 · Ukiyo-e Sky War" allow="autoplay; fullscreen"></iframe>
<script>
  // keyboard controls go to the game without an extra click
  const f = document.getElementById('game');
  f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) {} });
</script>
</body>
</html>
